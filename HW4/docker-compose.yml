services:
  bank:
    build: .
    image: secure-bank:latest
    container_name: secure-bank
    ports:
      - "9999:9999"            

    user: "10001:10001"          
    read_only: true          
    security_opt:
      - no-new-privileges:true    
    cap_drop:
      - ALL                     

    volumes:
      - bank-data:/data         
    tmpfs:
      - /tmp                  

    mem_limit: 256m
    cpus: 1.0
    pids_limit: 200

    restart: unless-stopped

volumes:
  bank-data:
